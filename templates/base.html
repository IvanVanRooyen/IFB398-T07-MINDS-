{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OreFox KMS</title>
  <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
    function toggleDark() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.theme = isDark ? 'dark' : 'light';
      updateSelects();
    }
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
  <script>
    function updateSelects() {
      document.querySelectorAll('select').forEach(function (sel) {
        sel.style.color = sel.value === '' ? '#9ca3af' : '';
      });
    }
    document.addEventListener('DOMContentLoaded', updateSelects);
    document.addEventListener('change', function (e) {
      if (e.target.tagName === 'SELECT') {
        e.target.style.color = e.target.value === '' ? '#9ca3af' : '';
      }
    });
  </script>
  {% block head_extra %}{% endblock %}
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <div class="flex min-h-screen">
    {% include "core/partials/sidebar.html" %}
    <main class="flex-1 p-6 bg-gray-50 dark:bg-gray-800{% block main_extra_class %}{% endblock %}">
      {% if messages %}
      <div class="mb-4 space-y-2">
        {% for message in messages %}
        <div class="px-4 py-3 rounded-lg text-sm font-medium
          {% if message.tags == 'success' %}bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-700 text-green-700 dark:text-green-300
          {% elif message.tags == 'error' %}bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-700 text-red-700 dark:text-red-300
          {% elif message.tags == 'warning' %}bg-yellow-50 dark:bg-yellow-900/30 border border-yellow-200 dark:border-yellow-700 text-yellow-700 dark:text-yellow-300
          {% else %}bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-700 text-blue-700 dark:text-blue-300{% endif %}">
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
