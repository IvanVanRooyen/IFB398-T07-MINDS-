[project]
name = "minds-geospatial"
version = "0.2.0"
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "Django>=5.2.12,<5.3",
    "django-environ>=0.13,<0.14",
    "django-htmx>=1.27,<2",
    "django-storages[s3]>=1.14.6,<2",
    "psycopg2-binary>=2.9.11,<3",
    "redis>=7.4,<8",
    "openpyxl>=3.1.5,<4",
    "pyproj>=3.7,<4",
    "pdfplumber>=0.11.9,<0.12",
    "Pillow>=13,<14",
    "python-docx>=1.2,<2",
    "reportlab>=4.4.10,<5",
    "requests>=2.33.1,<3",
    "Faker>=40.13,<41",
    "opentelemetry-api>=1.40,<2",
    "opentelemetry-sdk>=1.40,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.40,<2",
    "opentelemetry-instrumentation-django>=0.61b0,<1",
    "opentelemetry-instrumentation-logging>=0.61b0,<1",
]

[dependency-groups]
dev = ["ruff>=0.15,<0.16", "pip-audit>=2.10,<3"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
