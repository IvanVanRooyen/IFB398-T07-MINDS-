name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: minds-ci
      SECRET_KEY: ci-only-not-a-deployment-secret
      POSTGRES_DB: minds_ci
      POSTGRES_USER: minds
      POSTGRES_PASSWORD: ci-only-database-password
      DEMO_PASSWORD: ci-only-synthetic-user-password
      GF_PG_READER_USER: minds_ci_reader
      GF_PG_READER_PASS: ci-only-reader-password
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build locked application and test tools
        run: docker compose -f compose.dev.yml --profile test build checks
      - name: Migrations, lint, PostGIS tests and offline evaluation
        run: docker compose -f compose.dev.yml --profile test run --rm checks
      - name: Audit locked runtime dependencies
        run: docker compose -f compose.dev.yml --profile test run --rm checks sh scripts/audit.sh
      - name: Start the development app and separate worker
        run: docker compose -f compose.dev.yml up -d web report-worker
      - name: Verify synthetic data, private downloads and queued manual drafting
        run: docker compose -f compose.dev.yml exec -T web python -m scripts.smoke
      - name: Cleanup disposable services
        if: always()
        run: docker compose -f compose.dev.yml --profile test down --volumes
